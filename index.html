<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>crappzyt</title>
  <style>
    body { font-family: monospace; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input, button { display: block; width: 100%; box-sizing: border-box; padding: 0.4rem; margin: 0.4rem 0; }
    .error  { color: red; font-size: 0.9em; }
    .hint   { color: #666; font-size: 0.85em; }
    .hidden { display: none; }
    nav a   { margin-right: 1rem; cursor: pointer; text-decoration: underline; }
    .feed-item { display: flex; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    .feed-item img { width: 120px; height: 68px; object-fit: cover; flex-shrink: 0; }
    .feed-item-body { display: flex; flex-direction: column; }
    .feed-item-body .mark-read { margin-top: auto; font-size: 0.85em; cursor: pointer; }
    .sub-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; border-bottom: 1px solid #eee; }
    .sub-row button { width: auto; margin: 0; padding: 0.1rem 0.4rem; flex-shrink: 0; }
    .sub-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub-folder-input { width: 90px; padding: 0.1rem 0.3rem; font-size: 0.8em; font-family: monospace; margin: 0; flex-shrink: 0; }
    .folder-header { margin: 0.75rem 0 0.2rem; font-size: 0.85em; font-weight: bold; padding-bottom: 0.1rem; border-bottom: 1px solid #aaa; }
    #feed-filter select { display: inline-block; width: auto; margin: 0 0 0.5rem; }
  </style>
</head>
<body>

<!-- ── Setup ──────────────────────────────────────────────────────── -->
<div id="screen-setup">
  <h2>crappzyt — setup</h2>
  <input id="setup-token"    type="password" placeholder="GitHub token (gist scope)">
  <input id="setup-password" type="password" placeholder="Password">
  <input id="setup-confirm"  type="password" placeholder="Confirm password">
  <button id="setup-btn">Create</button>
  <p id="setup-error" class="error hidden"></p>
  <p class="hint">Creates a secret Gist. Note the Gist ID shown after — you need it on other devices.</p>
  <p><a onclick="showScreen('login')">Already have a Gist? Log in →</a></p>
</div>

<!-- ── Login ──────────────────────────────────────────────────────── -->
<div id="screen-login" class="hidden">
  <h2>crappzyt</h2>
  <input id="login-gist"     type="text"     placeholder="Gist ID">
  <input id="login-password" type="password" placeholder="Password">
  <button id="login-btn">Unlock</button>
  <p id="login-error" class="error hidden"></p>
  <p><a onclick="showScreen('setup')">First time? Set up →</a></p>
</div>

<!-- ── App ────────────────────────────────────────────────────────── -->
<div id="screen-app" class="hidden">
  <nav><strong>crappzyt</strong> — <a onclick="showPage('feed')">feed</a><a onclick="showPage('subs')">subscriptions</a></nav>
  <hr>

  <div id="page-feed">
    <div id="feed-filter">
      <select id="feed-folder-filter" onchange="loadFeed()">
        <option value="">All folders</option>
      </select>
    </div>
    <p id="feed-status" class="hint hidden"></p>
    <div id="feed-list"></div>
  </div>

  <div id="page-subs" class="hidden">
    <button id="refresh-btn">Refresh feeds</button>
    <p id="refresh-status" class="hint hidden"></p>
    <h3>Add channel</h3>
    <input id="sub-input"  type="text" placeholder="youtube.com/channel/UCxxxxx  or  UCxxxxx">
    <input id="sub-folder" type="text" placeholder="Folder (optional)" list="folder-datalist">
    <button id="sub-btn">Add</button>
    <p id="sub-error"  class="error hidden"></p>
    <p id="sub-status" class="hint  hidden"></p>
    <h3>Subscriptions</h3>
    <div id="sub-list"></div>
  </div>
</div>

<script>
// ── Crypto ─────────────────────────────────────────────────────────

const b64enc = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64dec = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const ENC = new TextEncoder();
const DEC = new TextDecoder();

async function deriveKey(password, salt) {
  const raw = await crypto.subtle.importKey('raw', ENC.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200_000, hash: 'SHA-256' },
    raw, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptToken(token, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(password, salt);
  const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, ENC.encode(token));
  return { enc: b64enc(ct), salt: b64enc(salt), iv: b64enc(iv) };
}

async function decryptToken({ enc, salt, iv }, password) {
  const key = await deriveKey(password, b64dec(salt));
  const pt  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(iv) }, key, b64dec(enc));
  return DEC.decode(pt);
}

// ── Gist ───────────────────────────────────────────────────────────

const FILE = 'crappzyt.json';

async function gistCreate(data, token) {
  const res = await fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ description: 'crappzyt', public: false,
      files: { [FILE]: { content: JSON.stringify(data, null, 2) } } }),
  });
  if (!res.ok) throw new Error(`GitHub ${res.status}: ${await res.text()}`);
  return res.json();
}

async function gistRead(id) {
  const res = await fetch(`https://api.github.com/gists/${id}`);
  if (!res.ok) throw new Error(`GitHub ${res.status}`);
  const g = await res.json();
  return JSON.parse(g.files[FILE].content);
}

async function gistWrite(id, data, token) {
  const body = JSON.stringify({ files: { [FILE]: { content: JSON.stringify(data, null, 2) } } });
  const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
  for (let attempt = 0; attempt < 4; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, 500 * 2 ** (attempt - 1)));
    const res = await fetch(`https://api.github.com/gists/${id}`, { method: 'PATCH', headers, body });
    if (res.ok) return;
    if (res.status !== 409) throw new Error(`GitHub ${res.status}`);
  }
  throw new Error('GitHub 409: too many conflicts, try again later');
}

// ── YouTube ────────────────────────────────────────────────────────

const PROXIES = [
  url => 'https://crossorigin.me/' + url,
  url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?' + encodeURIComponent(url),
  url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
  url => 'https://thingproxy.freeboard.io/fetch/' + url,
  url => 'https://cors.eu.org/' + url,
  url => 'https://proxy.cors.sh/' + url,
  url => 'https://test.cors.workers.dev/' + url,
];

function channelToRss(channelId) {
  return `https://www.youtube.com/feeds/videos.xml?playlist_id=UULF${channelId.slice(2)}`;
}

function resolveChannelId(raw) {
  raw = raw.trim();

  // bare channel ID
  if (/^UC[a-zA-Z0-9_-]{22}$/.test(raw)) return raw;

  // normalize to full URL
  if (!raw.startsWith('http')) raw = 'https://www.youtube.com/' + raw.replace(/^\/*/, '');

  let url;
  try { url = new URL(raw); } catch { throw new Error('Invalid URL'); }

  // /channel/UCxxxxxx — direct
  const direct = url.pathname.match(/\/channel\/(UC[a-zA-Z0-9_-]{22})/);
  if (direct) return direct[1];

  throw new Error('Paste the /channel/UCxxxxx URL — @handle URLs require a proxy.');
}

async function fetchWithProxy(url) {
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(url));
      if (res.ok) return res;
    } catch {}
  }
  throw new Error('All proxies failed');
}

async function fetchFeed(rssUrl) {
  const res = await fetchWithProxy(rssUrl);
  if (!res.ok) throw new Error(`RSS ${res.status}`);
  const doc = new DOMParser().parseFromString(await res.text(), 'text/xml');

  const MEDIA = 'http://search.yahoo.com/mrss/';
  const channelName = doc.querySelector('feed > author > name')?.textContent ?? 'Unknown';

  return {
    channelName,
    entries: [...doc.querySelectorAll('entry')].map(e => ({
      title:     e.querySelector('title')?.textContent ?? '',
      url:       e.querySelector('link')?.getAttribute('href') ?? '',
      published: e.querySelector('published')?.textContent ?? '',
      thumb:     e.getElementsByTagNameNS(MEDIA, 'thumbnail')[0]?.getAttribute('url') ?? '',
    })),
  };
}

// ── State ──────────────────────────────────────────────────────────

const app = { token: null, gistId: null, data: null };

const readSet = new Set();

function initReadSet() {
  readSet.clear();
  for (const url of (app.data.read || [])) readSet.add(url);
}

async function markRead(url) {
  readSet.add(url);
  app.data.read = [...readSet];
  document.getElementById('item-' + btoa(url).replace(/[^a-z0-9]/gi, ''))?.remove();
  await gistWrite(app.gistId, app.data, app.token);
}

// ── UI helpers ─────────────────────────────────────────────────────

function showScreen(name) {
  for (const s of ['setup','login','app'])
    document.getElementById(`screen-${s}`).classList.toggle('hidden', s !== name);
}

function showPage(name) {
  for (const p of ['feed','subs'])
    document.getElementById(`page-${p}`).classList.toggle('hidden', p !== name);
  if (name === 'feed') loadFeed();
  if (name === 'subs') renderSubs();
}

function setMsg(id, msg, show = !!msg) {
  const el = document.getElementById(id);
  if (msg) el.textContent = msg;
  el.classList.toggle('hidden', !show);
}

function setBtn(id, disabled, label) {
  const b = document.getElementById(id);
  b.disabled = disabled;
  b.textContent = label;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  return iso ? new Date(iso).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) : '';
}

// ── Feed ────────────────────────────────────────────────────────────

function renderEntries(entries) {
  const list = document.getElementById('feed-list');
  const unread = entries.filter(v => !readSet.has(v.url));
  if (!unread.length) {
    list.innerHTML = '';
    return setMsg('feed-status', 'Nothing unread.', true);
  }
  setMsg('feed-status', '', false);
  list.innerHTML = unread.map(v => {
    const id = 'item-' + btoa(v.url).replace(/[^a-z0-9]/gi, '');
    return `
    <div class="feed-item" id="${id}">
      ${v.thumb ? `<img src="${esc(v.thumb)}" loading="lazy" alt="">` : ''}
      <div class="feed-item-body">
        <div><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></div>
        <div><span class="hint">${esc(v.channel)} · ${fmtDate(v.published)}</span></div>
        <a class="mark-read" onclick="markRead(this.dataset.url)" data-url="${esc(v.url)}">mark as read</a>
      </div>
    </div>`;
  }).join('');
}

function flattenEntries() {
  return app.data.subscriptions
    .flatMap(s => (s.entries || []).map(e => ({ ...e, channel: s.name })))
    .sort((a, b) => new Date(b.published) - new Date(a.published));
}

async function refreshFeeds() {
  const subs = app.data.subscriptions;
  const results = await Promise.allSettled(subs.map(s => fetchFeed(s.rssUrl)));
  let changed = false;
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') {
      subs[i].entries    = r.value.entries;
      subs[i].fetchedAt  = new Date().toISOString();
      changed = true;
    }
  });
  if (!changed) return;
  await gistWrite(app.gistId, app.data, app.token);
  renderEntries(flattenEntries());
  setMsg('feed-status', '', false);
}

function getFolders() {
  return [...new Set(app.data.subscriptions.map(s => s.folder).filter(Boolean))].sort();
}

function getFolderForChannel(name) {
  return app.data.subscriptions.find(s => s.name === name)?.folder || '';
}

async function loadFeed() {
  const list = document.getElementById('feed-list');
  const filterEl = document.getElementById('feed-folder-filter');
  list.innerHTML = '';

  // Rebuild folder options, preserving current selection
  const folders = getFolders();
  const prev = filterEl.value;
  filterEl.innerHTML = '<option value="">All folders</option>' +
    folders.map(f => `<option value="${esc(f)}"${f === prev ? ' selected' : ''}>${esc(f)}</option>`).join('');
  const folderFilter = filterEl.value;

  const hasSubs = folderFilter
    ? app.data.subscriptions.some(s => s.folder === folderFilter)
    : app.data.subscriptions.length > 0;

  if (!hasSubs) {
    return setMsg('feed-status', 'No subscriptions yet. Add some in the subscriptions tab.', true);
  }

  const all = flattenEntries();
  const entries = folderFilter
    ? all.filter(e => getFolderForChannel(e.channel) === folderFilter)
    : all;

  if (entries.length) {
    renderEntries(entries);
  } else {
    setMsg('feed-status', 'No entries yet — hit Refresh on the subscriptions page.', true);
  }
}

// ── Subscriptions ───────────────────────────────────────────────────

document.getElementById('refresh-btn').addEventListener('click', async () => {
  setBtn('refresh-btn', true, 'Refreshing…');
  setMsg('refresh-status', '', false);
  try {
    await refreshFeeds();
    const ago = app.data.fetchedAt ? `Last fetched ${fmtDate(app.data.fetchedAt)}.` : '';
    setMsg('refresh-status', ago, true);
  } catch (e) {
    setMsg('refresh-status', 'Refresh failed: ' + e.message, true);
  } finally {
    setBtn('refresh-btn', false, 'Refresh feeds');
  }
});

function renderSubs() {
  const list = document.getElementById('sub-list');
  const { subscriptions: subs } = app.data;

  if (!subs.length) {
    list.innerHTML = '<p class="hint">No subscriptions yet.</p>';
    return;
  }

  // Group by folder; preserve original array index for mutations
  const groups = {};
  for (const [i, s] of subs.entries()) {
    const key = s.folder || '';
    if (!groups[key]) groups[key] = [];
    groups[key].push({ ...s, _i: i });
  }

  const namedFolders = Object.keys(groups).filter(f => f).sort();
  const datalist = `<datalist id="folder-datalist">${namedFolders.map(f => `<option value="${esc(f)}">`).join('')}</datalist>`;

  let html = datalist;
  for (const folder of [...namedFolders, '']) {
    if (!groups[folder]) continue;
    if (folder)
      html += `<p class="folder-header">${esc(folder)}</p>`;
    else if (namedFolders.length)
      html += `<p class="folder-header hint">Unfiled</p>`;

    html += groups[folder].map(s => `
      <div class="sub-row" id="sub-row-${s._i}">
        <span class="sub-name">${esc(s.name)}</span>
        <input class="sub-folder-input" type="text" value="${esc(s.folder || '')}" placeholder="folder"
          data-idx="${s._i}" list="folder-datalist"
          onblur="saveSubFolder(this)" onkeydown="if(event.key==='Enter')this.blur()">
        <button onclick="refreshSub(${s._i})">refresh</button>
        <button onclick="removeSub(${s._i})">remove</button>
      </div>`).join('');
  }

  list.innerHTML = html;
}

async function saveSubFolder(input) {
  const idx = +input.dataset.idx;
  const newFolder = input.value.trim() || undefined;
  const current = app.data.subscriptions[idx].folder || undefined;
  if (current === newFolder) return;
  if (newFolder) app.data.subscriptions[idx].folder = newFolder;
  else delete app.data.subscriptions[idx].folder;
  await gistWrite(app.gistId, app.data, app.token);
  renderSubs();
}

async function refreshSub(i) {
  const sub = app.data.subscriptions[i];
  const row = document.getElementById(`sub-row-${i}`);
  const btn = row.querySelector('button');
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const { entries } = await fetchFeed(sub.rssUrl);
    sub.entries   = entries;
    sub.fetchedAt = new Date().toISOString();
    await gistWrite(app.gistId, app.data, app.token);
  } catch (e) {
    alert(`Refresh failed for ${sub.name}: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = 'refresh';
  }
}

document.getElementById('sub-btn').addEventListener('click', async () => {
  setMsg('sub-error', '');
  const raw = document.getElementById('sub-input').value.trim();
  if (!raw) return;

  setBtn('sub-btn', true, 'Resolving…');
  try {
    setMsg('sub-status', 'Looking up channel…', true);
    const channelId = resolveChannelId(raw);
    const rssUrl = channelToRss(channelId);

    if (app.data.subscriptions.some(s => s.channelId === channelId))
      throw new Error('Already subscribed.');

    setMsg('sub-status', 'Fetching feed…', true);
    const { channelName, entries } = await fetchFeed(rssUrl);

    const folder = document.getElementById('sub-folder').value.trim() || undefined;
    app.data.subscriptions.push({
      channelId, name: channelName, rssUrl,
      entries, fetchedAt: new Date().toISOString(),
      ...(folder ? { folder } : {}),
    });

    setMsg('sub-status', 'Saving…', true);
    await gistWrite(app.gistId, app.data, app.token);

    document.getElementById('sub-input').value = '';
    document.getElementById('sub-folder').value = '';
    setMsg('sub-error', '');
    setMsg('sub-status', `Added: ${channelName}`, true);
    renderSubs();
  } catch (e) {
    setMsg('sub-error', e.message, true);
    setMsg('sub-status', '', false);
  } finally {
    setBtn('sub-btn', false, 'Add');
  }
});

async function removeSub(i) {
  app.data.subscriptions.splice(i, 1);
  await gistWrite(app.gistId, app.data, app.token);
  renderSubs();
}

// ── Auth ────────────────────────────────────────────────────────────

document.getElementById('setup-btn').addEventListener('click', async () => {
  setMsg('setup-error', '');
  const token    = document.getElementById('setup-token').value.trim();
  const password = document.getElementById('setup-password').value;
  const confirm  = document.getElementById('setup-confirm').value;

  if (!token)               return setMsg('setup-error', 'GitHub token is required.', true);
  if (!password)            return setMsg('setup-error', 'Password is required.', true);
  if (password !== confirm) return setMsg('setup-error', 'Passwords do not match.', true);

  setBtn('setup-btn', true, 'Creating…');
  try {
    const encrypted = await encryptToken(token, password);
    const data = { v: 1, ...encrypted, subscriptions: [], read: [] };
    const gist = await gistCreate(data, token);

    localStorage.setItem('crappzyt_gist', gist.id);
    sessionStorage.setItem('crappzyt_token', token);
    Object.assign(app, { token, gistId: gist.id, data });
    initReadSet();
    showScreen('app');
    showPage('feed');
  } catch (e) {
    setMsg('setup-error', e.message, true);
  } finally {
    setBtn('setup-btn', false, 'Create');
  }
});

document.getElementById('login-btn').addEventListener('click', async () => {
  setMsg('login-error', '');
  const gistId   = document.getElementById('login-gist').value.trim();
  const password = document.getElementById('login-password').value;

  if (!gistId)   return setMsg('login-error', 'Gist ID is required.', true);
  if (!password) return setMsg('login-error', 'Password is required.', true);

  setBtn('login-btn', true, 'Unlocking…');
  try {
    const data  = await gistRead(gistId);
    const token = await decryptToken(data, password);

    const check = await fetch('https://api.github.com/user', { headers: { Authorization: `Bearer ${token}` } });
    if (!check.ok) throw new Error('Token invalid or revoked.');

    localStorage.setItem('crappzyt_gist', gistId);
    sessionStorage.setItem('crappzyt_token', token);
    Object.assign(app, { token, gistId, data });
    initReadSet();
    showScreen('app');
    showPage('feed');
  } catch {
    setMsg('login-error', 'Wrong password, wrong Gist ID, or revoked token.', true);
  } finally {
    setBtn('login-btn', false, 'Unlock');
  }
});

// ── Enter key support ───────────────────────────────────────────────

for (const id of ['login-gist', 'login-password'])
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });

for (const id of ['setup-token', 'setup-password', 'setup-confirm'])
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('setup-btn').click(); });

for (const id of ['sub-input', 'sub-folder'])
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('sub-btn').click(); });

// ── Init ────────────────────────────────────────────────────────────

(async () => {
  const gistId = localStorage.getItem('crappzyt_gist');
  const token  = sessionStorage.getItem('crappzyt_token');

  if (gistId && token) {
    try {
      const data = await gistRead(gistId);
      Object.assign(app, { token, gistId, data });
      initReadSet();
      showScreen('app');
      showPage('feed');
      return;
    } catch {
      sessionStorage.removeItem('crappzyt_token');
    }
  }

  if (gistId) {
    document.getElementById('login-gist').value = gistId;
    showScreen('login');
  } else {
    showScreen('setup');
  }
})();
</script>
</body>
</html>
